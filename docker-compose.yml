# Desarrollo local: Postgres (equivalente a Supabase) y MinIO opcional.
#   docker compose up -d db
#   docker compose --profile minio up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: airadar
      POSTGRES_PASSWORD: airadar
      POSTGRES_DB: airadar
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airadar"]
      interval: 5s
      retries: 10

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: airadar
      MINIO_ROOT_PASSWORD: airadar-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
